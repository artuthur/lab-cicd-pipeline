# Noms d'hôtes = identifiants Vagrant (config.vm.define), réutilisés tels quels
# pour que le script de synchronisation des clés SSH reste cohérent.
# Noms de groupes volontairement différents des noms d'hôtes (leçon de lab-infra-as-code :
# éviter "Found both group and host with same name").

[gitlab_server]
gitlab ansible_host=192.168.57.10

[ci_runners]
runner ansible_host=192.168.57.11

[deploy_targets]
deploy_target ansible_host=192.168.57.12

[cicd:children]
gitlab_server
ci_runners
deploy_targets