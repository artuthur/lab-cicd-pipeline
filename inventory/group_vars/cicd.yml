# Connexion SSH : clé privée générée par Vagrant (provider vmware_desktop),
# copiée vers le système de fichiers natif de WSL2 par scripts/sync-vagrant-keys.sh
# (évite le souci de permissions 777 sur /mnt/c, déjà rencontré sur lab-infra-as-code).

ansible_user: vagrant
ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/lab-cicd-pipeline/private_key_{{ inventory_hostname }}"
ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
ansible_python_interpreter: /usr/bin/python3
